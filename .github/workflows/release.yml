name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build and release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: build
        run: cargo build --release --locked --package kanafix

      - name: assemble release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target/release/kanafix.exe out/kanafix.exe -Force
          $hash = (Get-FileHash out/kanafix.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  kanafix.exe" | Out-File -Encoding ascii out/SHA256SUMS.txt
          Write-Host "SHA256: $hash"

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/kanafix.exe
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
